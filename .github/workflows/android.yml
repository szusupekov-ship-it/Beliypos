
name: Build Beliy POS DEMO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q BeliyPOS_DEMO_GitHub_Build.zip -d extracted

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/BeliyPOS_DEMO/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures {"
          fix = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

          """
          if marker not in s:
              raise SystemExit("Не найден блок buildFeatures")
          p.write_text(s.replace(marker, fix + marker, 1))
          PY

      - name: Build APK
        run: |
          cd extracted/BeliyPOS_DEMO
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BeliyPOS-DEMO-APK
          path: extracted/BeliyPOS_DEMO/app/build/outputs/apk/debug/app-debug.apk

